user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}


http {
    # --- Общие настройки -------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream app { server 192.168.50.63:4000; }


    # --- TLS ----------------------------------------------------------------
    ssl_certificate      /etc/nginx/cert/server.crt;
    ssl_certificate_key  /etc/nginx/cert/server.key;

    # Минимальный набор безопасных протоколов/шифров
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --- Виртуальный хост ---------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name  localhost;   # поменяйте при необходимости

        # Перенаправление http → https (по желанию)
        if ($scheme = http) {
            return 301 https://$host$request_uri;
        }

        # Прокси к приложению, работающему на 8080

   location / {
     proxy_pass http://app;
     proxy_set_header Host $http_host;
     proxy_set_header X-Forwarded-Host $http_host;
     proxy_set_header X-Forwarded-Proto https;
     proxy_set_header X-Forwarded-Port 8443;

     proxy_set_header X-Real-IP $remote_addr;
     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   }
        # Статические файлы (если нужны)
        # location /static/ {
        #     alias /path/to/static/;
        # }
    }
}